user nginx;
worker_processes 1;

error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;
    server_tokens off;
    gzip on;
    open_file_cache max=100;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/html;

        location ~ /\. { deny all; }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location = /favicon.ico {
            alias /usr/share/nginx/html/brand/favicon.ico;
        }

        location ^~ /brand/ {
            alias /usr/share/nginx/html/brand/;
            expires 7d;
        }

        location = /als/ping {
            default_type text/plain;
            add_header Cache-Control 'no-store' always;
            return 200 '';
        }

        # Only the selected ALS speed APIs are public; its shell and other tools are not proxied.
        location ~ "^/als/(?:session|speedtest_worker\.js|session/[a-f0-9-]{36}/speedtest/(?:download|upload|file/[0-9]+(?:KB|MB|GB|TB)\.test)|method/(?:speedtest_dot_net|iperf3/server|cache/interfaces))$" {
            rewrite ^/als/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:19080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            client_max_body_size 32m;
            client_body_timeout 30s;
            gzip off;
            add_header Cache-Control 'no-store' always;
        }

        location /als/ {
            return 404;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass localhost:9000;
            fastcgi_index index.php;
            include fastcgi.conf;
            fastcgi_buffering on;
            fastcgi_buffer_size 1k;
            fastcgi_buffers 128 1k;
            fastcgi_max_temp_file_size 0;
            gzip off;
        }
    }
}
