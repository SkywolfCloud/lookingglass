services:
  nginx:
    image: skywolfcloud/lookingglass-nginx:local
    container_name: lg-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    network_mode: host
    restart: unless-stopped
    depends_on:
      speed-backend:
        condition: service_healthy

  php-fpm:
    image: skywolfcloud/lookingglass-php:local
    container_name: lg-php
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect localhost:9000 >/dev/null 2>&1 || exit 1"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    environment:
      # For a better reference as to what these variables do, check out 'config.dist.php' or 'docker/php-fpm/src/config.php'.
      # Please replace them with values that are relevant to your situation!
      LOCATION: Location
      FACILITY: Facility
      FACILITY_URL: http://localhost/
      LOGO_URL: https://github.com/hybula/lookingglass/
      LOGO: '<h2 style="color: #000000;">Company Looking Glass</h2>'
      LOGO_DARK: '<h2 style="color: #ffffff;">Company Looking Glass</h2>'
      IPV4_ADDRESS: 127.0.0.1
      IPV6_ADDRESS: ::1
      MAPS_QUERY: Amsterdam
      # Pass these variables with any arbitrary value to disable the respective block.
      # DISABLE_BLOCK_NETWORK: 'true'
      # DISABLE_BLOCK_LOOKINGGLASS: 'true'
      # DISABLE_BLOCK_SPEEDTEST: 'true'
      # Uncomment to enable the custom block, which you can use to add something custom to the LG.
      # ENABLE_CUSTOM_BLOCK: 'true'
      # Uncomment if you require visitors to accept the Terms of Use; the value should be a link to the terms.
      # LG_TERMS: http://localhost/
      # Comma-separated list of enabled methods (default: all methods enabled).
      # METHODS: ping,ping6,mtr,mtr6,traceroute,traceroute6,nexttrace,nexttrace6
      # Comma-separated "Label|URL" pairs for other looking glass locations (default: none).
      # LOCATIONS: "Amsterdam|https://ams.lg.example.com,Frankfurt|https://fra.lg.example.com"
      # Comma-separated "Label|URL" pairs for speedtest files (default: none).
      # SPEEDTEST_FILES: "100MB|https://example.com/100mb.bin,1GB|https://example.com/1gb.bin"

  speed-backend:
    image: wikihostinc/looking-glass-server@sha256:a04ad6948c7246497490d2ce724b0488a30454e1b63c64c7d8406b85a4ed9892
    container_name: lg-speed-backend
    network_mode: host
    restart: unless-stopped
    environment:
      LISTEN_IP: '127.0.0.1'
      HTTP_PORT: '19080'
      LOCATION: Location
      PUBLIC_IPV4: '127.0.0.1'
      PUBLIC_IPV6: '::1'
      SPEEDTEST_FILE_LIST: '1MB 10MB 100MB 1GB'
      ENABLE_SPEEDTEST: 'true'
      DISPLAY_TRAFFIC: 'true'
      UTILITIES_SPEEDTESTDOTNET: 'true'
      UTILITIES_IPERF3: 'true'
      UTILITIES_IPERF3_PORT_MIN: '5201'
      UTILITIES_IPERF3_PORT_MAX: '5210'
      UTILITIES_PING: 'false'
      UTILITIES_FAKESHELL: 'false'
      UTILITIES_MTR: 'false'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:$${HTTP_PORT:-19080}/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

